<html lang="en">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest: #0F2B1E;
      --forest-mid: #1A4A30;
      --forest-light: #4A8C6A;
      --gold: #C09A42;
      --gold-light: #E0BC6A;
      --parchment: #F5F0E8;
      --tan: #DDD5C0;
      --white: #FFFFFF;
      --text: #1A1A1A;
      --text-mid: #3D3D3D;
      --text-muted: #888;
      --np: #2D7D46;
      --sp: #1A6FA8;
      --prv: #C07A20;
      --cty: #6B4CA8;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--forest); color: var(--white); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── HEADER ── */
    .header {
      background: var(--forest);
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding: 0 20px;
      display: flex; align-items: center; gap: 20px;
      height: 56px; flex-shrink: 0;
    }
    .header-logo {
      font-size: 15px; font-weight: 700; color: var(--gold-light); white-space: nowrap;
      letter-spacing: -.2px;
    }
    .header-title { font-size: 13px; color: rgba(255,255,255,.5); }
    .header-divider { width: 1px; height: 20px; background: rgba(255,255,255,.1); }
    .header-count { font-size: 13px; color: rgba(255,255,255,.4); margin-left: auto; }
    #visibleCount { color: var(--gold-light); font-weight: 600; }

    /* ── FILTER BAR ── */
    .filterbar {
      background: var(--forest-mid);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      flex-shrink: 0;
    }
    .filterbar-label { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: rgba(255,255,255,.4); margin-right: 4px; }
    .filter-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12.5px; font-weight: 600;
      border: 1.5px solid transparent;
      cursor: pointer; transition: all .15s; white-space: nowrap;
      background: rgba(255,255,255,.07); color: rgba(255,255,255,.6);
    }
    .filter-btn .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .filter-btn.active { color: var(--white); }
    .filter-btn[data-type="all"].active { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.3); }
    .filter-btn[data-type="National Park"].active { background: rgba(45,125,70,.3); border-color: #2D7D46; color: #7DD4A0; }
    .filter-btn[data-type="State Park"].active { background: rgba(26,111,168,.3); border-color: #1A6FA8; color: #7BB8E8; }
    .filter-btn[data-type="Private Campground"].active { background: rgba(192,122,32,.3); border-color: #C07A20; color: #E8B870; }
    .filter-btn[data-type="County Campground"].active { background: rgba(107,76,168,.3); border-color: #6B4CA8; color: #B8A0E0; }

    .search-wrap { margin-left: auto; position: relative; }
    .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.3); pointer-events: none; }
    #searchBox {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px; padding: 5px 12px 5px 30px;
      font-size: 12.5px; color: var(--white); width: 200px;
      outline: none; transition: border-color .15s;
    }
    #searchBox::placeholder { color: rgba(255,255,255,.3); }
    #searchBox:focus { border-color: rgba(255,255,255,.3); }

    /* ── MAP ── */
    #map { flex: 1; min-width: 0; min-height: 300px; }

    /* ── LEGEND ── */
    .legend {
      position: absolute; bottom: 28px; right: 10px; z-index: 1000;
      background: rgba(15,43,30,.92); border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px);
      font-size: 12px;
    }
    .legend-title { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 10px; }
    .legend-row { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.75); margin-bottom: 6px; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-count { margin-left: auto; padding-left: 16px; color: rgba(255,255,255,.35); font-size: 11px; }

    /* ── LEAFLET POPUP ── */
    .leaflet-popup-content-wrapper {
      background: var(--forest) !important;
      border: 1px solid rgba(255,255,255,.12) !important;
      border-radius: 10px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,.5) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content { margin: 0 !important; width: 270px !important; }
    .leaflet-popup-tip { background: var(--forest) !important; }
    .leaflet-popup-close-button { color: rgba(255,255,255,.4) !important; top: 10px !important; right: 10px !important; font-size: 16px !important; }
    .leaflet-popup-close-button:hover { color: var(--white) !important; }
    .popup-header { padding: 14px 42px 10px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .popup-type { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 4px; }
    .popup-name { font-size: 14px; font-weight: 700; color: var(--white); line-height: 1.3; }
    .popup-body { padding: 10px 16px 14px; }
    .popup-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #C8D7CD; margin-bottom: 5px; }
    .popup-row:last-of-type { margin-bottom: 0; }
    .popup-actions { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; margin-top: 12px; }
    .leaflet-container a.popup-link,
    .leaflet-container a.popup-directions {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 10px; border-radius: 20px; min-height: 44px;
      font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .leaflet-container a.popup-link { background: var(--gold); color: var(--forest); }
    .leaflet-container a.popup-link:hover { background: var(--gold-light); color: var(--forest); }
    .leaflet-container a.popup-directions { border: 1px solid rgba(255,255,255,.28); color: var(--white); }
    .leaflet-container a.popup-directions:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); color: var(--white); }
  a { color:inherit; text-decoration:none; }
    .header-title { color:#eee; white-space:nowrap; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    .filter-btn { min-height:44px; }
    .filter-btn[data-type="National Forest"].active { background:#324F38; border-color:#A7D6B4; color:#D6ECD9; }
    .leaflet-container a.leaflet-popup-close-button { width:32px; height:32px; line-height:32px; top:4px !important; right:4px !important; color:#C8D7CD !important; }
    #searchBox { min-height:44px; }
    #searchBox::placeholder { color:#BCCBC2; }
    @media(max-width:600px){
      .filterbar {
        display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
        width:100%; min-width:0; overflow:hidden;
        gap:6px; padding:8px 12px;
      }
      .filterbar-label { display:none; }
      .filter-btn { width:100%; min-width:0; justify-content:center; font-size:12px; padding:5px 9px; }
      .search-wrap { grid-column:1 / -1; width:100%; min-width:0; margin:0; }
      #searchBox { width:100%; font-size:16px; }
      .legend { display:none; } /* Type names and colors remain in the filter bar. */
      .leaflet-control-zoom { display:none; }
      .leaflet-popup-pane { z-index:900; }

      .header { width:100%; min-width:0; height:auto; min-height:76px; flex-wrap:wrap; gap:6px 14px; padding:12px 16px; }
      .header-logo { font-size:14px; }
      .header-divider { display:none; }
      .header-count { margin-left:0; width:100%; }
    }
  </style>
</head>

// ── MAP INIT ──────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [47.4, -121.5],
  zoom: 7,
  zoomControl: true,
});

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

// ── COLORS ───────────────────────────────────────────────────────────────
const TYPE_CONFIG = {
  'National Forest': { color: '#50774b', label: 'National Forest' },
  'National Park':      { color: '#2D7D46', label: 'National Park' },
  'State Park':         { color: '#1A6FA8', label: 'State Park' },
  'Private Campground': { color: '#C07A20', label: 'Private' },
  'County Campground':  { color: '#6B4CA8', label: 'County' },
};
const fallbackColor = '#888';

function makeIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30">
    <path d="M11 0C4.925 0 0 4.925 0 11c0 8.25 11 19 11 19s11-10.75 11-19C22 4.925 17.075 0 11 0z" fill="${color}" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
    <circle cx="11" cy="11" r="4.5" fill="rgba(255,255,255,0.9)"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [22, 30],
    iconAnchor: [11, 30],
    popupAnchor: [0, -28],
  });
}

// ── POPUP HTML ────────────────────────────────────────────────────────────
function popupHTML(c) {
  const cfg = TYPE_CONFIG[c.type] || { color: fallbackColor, label: c.type };
  const hookupIcon = c.hookups === 'No hookups' ? '⚡' : c.hookups.includes('Full') ? '🔌' : '🔌';
  const hookupStyle = c.hookups === 'No hookups' ? 'color:#C8D7CD' : 'color:rgba(144,210,160,.9)';
  return `
    <div class="popup-header">
      <div class="popup-type" style="color:#A7D6B4">${cfg.label}</div>
      <div class="popup-name">${c.name}</div>
    </div>
    <div class="popup-body">
      <div class="popup-row">📍 ${c.town}</div>
      <div class="popup-row">🚗 ${c.drive}</div>
      <div class="popup-row" style="${hookupStyle}">${c.rvAccess==='no'?'Tent only · no RV access':hookupIcon+' '+c.hookups}</div>
      <div class="popup-actions">
        <a class="popup-link" href="/campground/${c.slug}">View listing <span aria-hidden="true">→</span></a>
        <a class="popup-directions" href="https://www.google.com/maps/dir/?api=1&amp;destination=${c.lat},${c.lon}&amp;travelmode=driving" target="_blank" rel="noopener">Directions <span aria-hidden="true">↗</span></a>
      </div>
    </div>`;
}

// ── BUILD MARKERS ─────────────────────────────────────────────────────────
const markers = [];
const layerGroups = {};
Object.keys(TYPE_CONFIG).forEach(t => { layerGroups[t] = L.layerGroup().addTo(map); });

const typeCounts = {};
CAMPS.forEach(c => {
  const cfg = TYPE_CONFIG[c.type];
  const color = cfg ? cfg.color : fallbackColor;
  const marker = L.marker([c.lat, c.lon], { icon: makeIcon(color), title: c.name, alt: c.name })
    .bindPopup(popupHTML(c), { maxWidth: 260 });
  const group = layerGroups[c.type];
  if (group) group.addLayer(marker);
  else marker.addTo(map);
  markers.push({ marker, camp: c, group });
  typeCounts[c.type] = (typeCounts[c.type] || 0) + 1;
});

// ── LEGEND ────────────────────────────────────────────────────────────────
const legendControl = L.control({ position: 'bottomright' });
legendControl.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `<div class="legend-title">Campground Type</div>` +
    Object.entries(TYPE_CONFIG).map(([type, cfg]) =>
      `<div class="legend-row">
        <span class="legend-dot" style="background:${cfg.color}"></span>
        ${cfg.label}
        <span class="legend-count">${typeCounts[type] || 0}</span>
      </div>`
    ).join('');
  return div;
};
legendControl.addTo(map);

// ── FILTER LOGIC ──────────────────────────────────────────────────────────
let activeType = 'all';
let searchQuery = '';

function applyFilters() {
  let count = 0;
  const visiblePoints = [];
  markers.forEach(({ marker, camp, group }) => {
    const typeMatch = activeType === 'all' || camp.type === activeType;
    const searchMatch = !searchQuery || camp.name.toLowerCase().includes(searchQuery) || camp.town.toLowerCase().includes(searchQuery);
    const visible = typeMatch && searchMatch;
    if (visible) {
      if (group && !group.hasLayer(marker)) group.addLayer(marker);
      else if (!group) marker.addTo(map);
      count++;
      visiblePoints.push([camp.lat, camp.lon]);
    } else {
      if (group) group.removeLayer(marker);
      else map.removeLayer(marker);
    }
  });
  document.getElementById('visibleCount').textContent = count;
  map.closePopup();
  if (visiblePoints.length) map.fitBounds(visiblePoints, { padding:[36,36], maxZoom:10, animate:false });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.setAttribute('aria-pressed', String(btn.classList.contains('active')));
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
    btn.setAttribute('aria-pressed','true');
    btn.classList.add('active');
    activeType = btn.dataset.type;
    applyFilters();
  });
});

applyFilters();

document.getElementById('searchBox').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  applyFilters();
});
</script>
